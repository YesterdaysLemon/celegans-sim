# Quality gates for the browser viewer and the WebAssembly runtime.
#
# The viewer has no build step, which is deliberate -- a static file server is enough to
# run the animal -- but it means nothing between "I typed it" and "it is a black rectangle
# in someone's browser" ever looks at the code. These jobs are that step.
#
# The Python model has its own suite in tests/, which is slow (25 minutes of simulation)
# and is not run here; the Python used below is only the server transport and the
# reference side of the WebAssembly conformance check.

name: viewer

on:
  push:
    branches: [main]
    paths: ['web/**', 'wasm/**', 'worm/server.py', 'run.py', 'requirements.txt',
            'docker/nginx.conf', 'tools/check_cache_headers.mjs', 'tools/check_web.mjs',
            'tools/smoke_server.mjs', 'tools/smoke_web.mjs', 'tools/sim_rate.test.mjs',
            'package.json', 'package-lock.json', '.github/workflows/viewer.yml']
  pull_request:
    paths: ['web/**', 'wasm/**', 'worm/server.py', 'run.py', 'requirements.txt',
            'docker/nginx.conf', 'tools/check_cache_headers.mjs', 'tools/check_web.mjs',
            'tools/smoke_server.mjs', 'tools/smoke_web.mjs', 'tools/sim_rate.test.mjs',
            'package.json', 'package-lock.json', '.github/workflows/viewer.yml']

jobs:
  viewer:
    name: static checks and browser smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund

      # The production cache boundary lives in nginx, not in the local smoke server.
      # Exercise that exact config so a new module cannot fall back to heuristic caching.
      - name: every viewer asset has a deliberate cache policy
        run: |
          docker run --rm -d --name celegans-cache-policy \
            -p 127.0.0.1:8080:8080 \
            -v "$PWD/web:/usr/share/nginx/html:ro" \
            -v "$PWD/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine
          trap 'docker stop celegans-cache-policy' EXIT
          npm run check:headers -- http://127.0.0.1:8080

      # Cheapest first, and the one with the clearest message. A module that does not parse
      # never reaches the browser check as anything but "blank page".
      - name: every module parses
        run: |
          for f in $(find web -name '*.js') tools/*.mjs wasm/conform.mjs; do
            node --check "$f" || exit 1
          done
          echo "$(find web -name '*.js' | wc -l) viewer modules parse"

      - name: module graph resolves and is acyclic
        run: node tools/check_web.mjs

      # Sim rate is a ratio of two times, so it is testable without a browser and without a
      # .wasm: LocalEngine takes a clock, and this drives it with a scripted one. The
      # readout used to divide by the time spent stepping rather than by the wall clock,
      # which is invisible to every other check in this file -- the page loads, the number
      # moves, and only what it *means* is wrong (#56).
      - name: the rate readouts measure what their labels claim
        run: node --test tools/sim_rate.test.mjs

      # ubuntu-latest ships Chrome; puppeteer-core drives it rather than downloading its
# own, which keeps `npm ci` at a couple of seconds.
      - name: browser smoke test
        run: node tools/smoke_web.mjs
        env:
          CHROME: /usr/bin/google-chrome

  server-transport:
    name: the Python WebSocket reaches the viewer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: pip install -r requirements.txt
      - run: npm ci --no-audit --no-fund

      - name: Python server transport smoke test
        run: node tools/smoke_server.mjs
        env:
          CHROME: /usr/bin/google-chrome

  conformance:
    name: the port still reproduces the Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: pip install -r requirements.txt
      - run: npm ci --no-audit --no-fund
        working-directory: wasm

      - name: conformance input diagnostics
        run: node --test wasm/conform-inputs.test.mjs

      # The exporter and the compiler are one command's worth of output apart: the .wasm
      # has the .model's byte offsets compiled into it, so a mismatched pair does not
      # degrade gracefully, it reads the wrong offsets.
      - name: rebuild the model and the runtime
        run: |
          python tools/export_model.py
          cd wasm && npx asc assembly/index.ts --target release
        env:
          PYTHONPATH: .

      # conform.json is a *recording* of what the Python did, so it is regenerated here
      # rather than committed. A stale one does not weaken this check, it inverts it: the
      # port gets measured against a model that no longer exists.
      - name: reference trajectories, then compare
        run: |
          python tools/conform.py > web/conform.json
          node wasm/conform.mjs
        env:
          PYTHONPATH: .

      # Conformance runs one animal, because it compares against a Python Simulation and a
      # Simulation is one animal. These are the invariants that only exist when several
      # share a plate -- the ordering of the world advance, whether animals perturb one
      # another, and whether a population can be turned over. They need no Python
      # reference, so they cost only the model and the runtime built above.
      - name: the population behaves as a population
        run: node wasm/population.mjs
