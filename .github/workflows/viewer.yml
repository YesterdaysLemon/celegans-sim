# Quality gates for the browser viewer and the WebAssembly runtime.
#
# The viewer has no build step, which is deliberate -- a static file server is enough to
# run the animal -- but it means nothing between "I typed it" and "it is a black rectangle
# in someone's browser" ever looks at the code. These jobs are that step.
#
# The Python model has its own suite in tests/, which is slow (25 minutes of simulation)
# and is not run here; the Python used below is only the server transport and the
# reference side of the WebAssembly conformance check.

name: viewer

# PAUSED AT THE JOBS, NOT AT THE TRIGGERS. See `CI_ENABLED` below.
#
# This account's Actions minutes are exhausted, so every push and every pull request was
# starting a run that died in seconds having executed no steps at all -- the API reports
# `steps: []` with no failed step, because the job never got a runner. A permanent red
# cross that says nothing about the code is worse than no signal: a check that always
# fails is as uninformative as one that always passes, and it trains you to ignore the one
# time it means something.
#
# The first attempt at this commented out `on:` and left only workflow_dispatch. That was
# wrong, and tests/test_ci_policy.py caught it -- a workflow that does not trigger produces
# no status at all, which reads on a pull request as "nothing to report", and #44 was filed
# because a PR merged with exactly that empty rollup. Removing the triggers is the defect
# that test exists to detect, so it is not available as a way to stop the runs.
#
# Gating the jobs instead keeps both properties. `paths:` stays live, so the filters are
# still declared and still pinned by that test; and a job whose `if` is false is skipped by
# the Actions service before a runner is allocated, so it consumes no minutes and reports
# `skipped` rather than a red cross.
#
# Re-enable everything by setting the repository variable CI_ENABLED to `true` (Settings ->
# Secrets and variables -> Actions -> Variables). Nothing else needs editing, and nothing in
# the jobs was weakened to make anything pass. Until then the checks run locally -- see
# "Running the checks yourself" in the README.

on:
  push:
    branches: [main]
    paths: ['web/**', 'wasm/**', 'worm/server.py', 'run.py', 'requirements.txt',
            'docker/nginx.conf', 'tools/check_cache_headers.mjs', 'tools/check_web.mjs',
            'tools/smoke_server.mjs', 'tools/smoke_web.mjs', 'tools/sim_rate.test.mjs',
            'package.json', 'package-lock.json', '.github/workflows/viewer.yml']
  pull_request:
    paths: ['web/**', 'wasm/**', 'worm/server.py', 'run.py', 'requirements.txt',
            'docker/nginx.conf', 'tools/check_cache_headers.mjs', 'tools/check_web.mjs',
            'tools/smoke_server.mjs', 'tools/smoke_web.mjs', 'tools/sim_rate.test.mjs',
            'package.json', 'package-lock.json', '.github/workflows/viewer.yml']
  workflow_dispatch:

jobs:
  viewer:
    name: static checks and browser smoke test
    if: ${{ vars.CI_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund

      # The production cache boundary lives in nginx, not in the local smoke server.
      # Exercise that exact config so a new module cannot fall back to heuristic caching.
      - name: every viewer asset has a deliberate cache policy
        run: |
          docker run --rm -d --name celegans-cache-policy \
            -p 127.0.0.1:8080:8080 \
            -v "$PWD/web:/usr/share/nginx/html:ro" \
            -v "$PWD/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine
          trap 'docker stop celegans-cache-policy' EXIT
          npm run check:headers -- http://127.0.0.1:8080

      # Cheapest first, and the one with the clearest message. A module that does not parse
      # never reaches the browser check as anything but "blank page".
      - name: every module parses
        run: |
          for f in $(find web -name '*.js') tools/*.mjs wasm/*.mjs; do
            node --check "$f" || exit 1
          done
          echo "$(find web -name '*.js' | wc -l) viewer modules parse"

      - name: module graph resolves and is acyclic
        run: node tools/check_web.mjs

      # Sim rate is a ratio of two times, so it is testable without a browser and without a
      # .wasm: LocalEngine takes a clock, and this drives it with a scripted one. The
      # readout used to divide by the time spent stepping rather than by the wall clock,
      # which is invisible to every other check in this file -- the page loads, the number
      # moves, and only what it *means* is wrong (#56).
      - name: the rate readouts measure what their labels claim
        run: node --test tools/sim_rate.test.mjs

      # ubuntu-latest ships Chrome; puppeteer-core drives it rather than downloading its
# own, which keeps `npm ci` at a couple of seconds.
      - name: browser smoke test
        run: node tools/smoke_web.mjs
        env:
          CHROME: /usr/bin/google-chrome

  server-transport:
    name: the Python WebSocket reaches the viewer
    if: ${{ vars.CI_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: pip install -r requirements.txt
      - run: npm ci --no-audit --no-fund

      - name: Python server transport smoke test
        run: node tools/smoke_server.mjs
        env:
          CHROME: /usr/bin/google-chrome

  conformance:
    name: the port still reproduces the Python
    if: ${{ vars.CI_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: pip install -r requirements.txt
      - run: npm ci --no-audit --no-fund
        working-directory: wasm

      - name: conformance input diagnostics
        run: node --test wasm/conform-inputs.test.mjs

      # The exporter and the compiler are one command's worth of output apart: the .wasm
      # has the .model's byte offsets compiled into it, so a mismatched pair does not
      # degrade gracefully, it reads the wrong offsets.
      - name: rebuild the model and the runtime
        run: |
          python tools/export_model.py
          cd wasm && npx asc assembly/index.ts --target release
        env:
          PYTHONPATH: .

      # #37's regression property: raising `volume_per_pump` tenfold multiplies `food_eaten`
      # by 9.3x while the animal's trajectory is unchanged to five figures, and the energy
      # budget in wasm/evolve.mjs must refuse to pay for that. It runs here rather than in
      # the viewer job because it needs a .model and a .wasm built from the same tree -- it
      # varies the pharynx by patching the compiled f64 constant, which is the only way to
      # move a scalar that is deliberately neither a gene nor a payload field.
      - name: a bigger pharynx buys no fitness
        run: node --test wasm/energy-fitness.test.mjs

      # Also here rather than in the viewer job, and for the same reason: it compares
      # trajectories, so it needs a .model and a .wasm that agree with each other.
      - name: the dish remembers what it is filled with
        run: node --test wasm/medium.test.mjs

      # This existed and ran nowhere. The physics guard was ported to the runtime because
      # evolution runs there, and its test -- the file whose own header says a guard that
      # has never been observed to fire is not known to work -- was never added to a
      # workflow or to the README's local list. tools/audit.py found it the way it finds
      # everything: raising the curvature limit past anything the body can reach is caught
      # by this file and by nothing else in the battery, conformance included.
      - name: the physics guard still fires
        run: node --test wasm/invariants.test.mjs

      # conform.json is a *recording* of what the Python did, so it is regenerated here
      # rather than committed. A stale one does not weaken this check, it inverts it: the
      # port gets measured against a model that no longer exists.
      - name: reference trajectories, then compare
        run: |
          python tools/conform.py > web/conform.json
          node wasm/conform.mjs
        env:
          PYTHONPATH: .

      # Conformance used to run one animal in every case, because it compares against a
      # Python Simulation and a Simulation is one animal; its MULTI-ANIMAL case now runs a
      # Python Population against `stepAll` on a contested lawn. These are the remaining
      # invariants that need no Python reference at all -- whether animals perturb one
      # another, whether contested feeding is order-free, whether a population can be
      # turned over -- so they cost only the model and the runtime built above.
      - name: the population behaves as a population
        run: node wasm/population.mjs

      # An animal's memory footprint was documented in three places and measured in none,
      # and the documented figure was out by a factor of a hundred (#33). This measures it
      # off the runtime's own exports and fails if any of those documents stops agreeing.
      # Sub-second, so there is no reason for it not to run on every push.
      - name: an animal costs what the documents say it costs
        run: node wasm/memory.mjs
