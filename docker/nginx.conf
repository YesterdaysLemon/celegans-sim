# The model file is 3 MB of mostly-zero float64 and compresses to a fraction of that, so
# gzip is not a nicety here -- it is most of the transfer. WebAssembly and the model are
# immutable per build, so they can be cached hard; the HTML cannot, or a redeploy leaves
# visitors on a page that loads last week's animal.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm application/octet-stream;

    types { application/wasm wasm; }

    location ~* \.(wasm|model)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / { try_files $uri $uri/ =404; }
}
