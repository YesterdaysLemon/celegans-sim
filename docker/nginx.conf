# The model file is 3 MB of mostly-zero float64 and compresses to a fraction of that, so
# gzip is not a nicety here -- it is most of the transfer. WebAssembly and the model are
# immutable per build, so they can be cached hard. The viewer's source files deliberately
# have no build step, so their static import specifiers cannot be rewritten to hashed names;
# every unhashed file is revalidated instead. That prevents a redeploy from combining
# modules from different commits while retaining the browser's cheap ETag round trips.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm application/octet-stream;

    # No `types` block here, deliberately, and the reason is worth stating because the
    # obvious edit is the broken one. A `types` block *replaces* the inherited MIME map
    # rather than adding to it, so `types { application/wasm wasm; }` -- which is what this
    # file used to say -- left every other extension falling through to `default_type`,
    # which the base image sets to application/octet-stream. HTML, CSS and every ES module
    # were served as binary, and a browser refuses a module with a non-JavaScript MIME type
    # outright. The production container could therefore fail before the viewer ran a line
    # of code, while `tools/smoke_web.mjs` stayed green because it drives a Node server
    # with its own, correct, types.
    #
    # `default_type` is a different directive and does not clobber the map: it supplies a
    # type only where the map has no entry. So the WebAssembly mapping is stated
    # per-location instead -- a no-op on any nginx whose mime.types already knows wasm
    # (they have since 1.21) and correct on any that does not.
    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # The model payload is a private binary format with no registered media type, so the
    # inherited application/octet-stream is the honest answer. It is read with fetch(),
    # which does not care.
    location ~* \.model$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # HTML, the manifest, CSS, and every JavaScript module are unhashed. Revalidate all of
    # them rather than enumerating today's module graph and silently missing tomorrow's.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
