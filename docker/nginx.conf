# The model file is 3 MB of mostly-zero float64 and compresses to a fraction of that, so
# gzip is not a nicety here -- it is most of the transfer. WebAssembly and the model are
# immutable per build, so they can be cached hard. The viewer's source files deliberately
# have no build step, so their static import specifiers cannot be rewritten to hashed names;
# every unhashed file is revalidated instead. That prevents a redeploy from combining
# modules from different commits while retaining the browser's cheap ETag round trips.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm application/octet-stream;

    types { application/wasm wasm; }

    location ~* \.(wasm|model)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # HTML, the manifest, CSS, and every JavaScript module are unhashed. Revalidate all of
    # them rather than enumerating today's module graph and silently missing tomorrow's.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
