<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design 3 — Poster</title>
<!-- Design language 3 of 5: POSTER. Bauhaus/Swiss: flat primaries, thick ink outlines,
     hard offset shadows, huge grotesk type. The dish as artwork, the arena's party
     dress. Self-contained demo -- fake data, no imports, open via file://. -->
<style>
:root {
  --cream: #f4efe4; --ink: #16130e; --red: #e0342b; --yellow: #f5c518;
  --blue: #1857c3; --green: #199e70;
  font-family: 'Helvetica Neue', 'Arial Narrow', Futura, Arial, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--cream); color: var(--ink); }
#poster { max-width: 1220px; margin: 0 auto; padding: 22px 26px 50px; }
header { display: flex; align-items: flex-end; gap: 18px;
  border-bottom: 6px solid var(--ink); padding-bottom: 10px; }
h1 { font-size: 56px; line-height: 0.9; margin: 0; font-weight: 800;
  letter-spacing: -0.03em; text-transform: uppercase; }
h1 span { color: var(--red); }
.tag { font-size: 14px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.06em; margin-bottom: 6px; }
.tag.b { background: var(--yellow); border: 3px solid var(--ink); padding: 4px 10px;
  box-shadow: 5px 5px 0 var(--ink); }
.stats { display: flex; gap: 12px; margin: 18px 0; flex-wrap: wrap; }
.stat { border: 3px solid var(--ink); background: #fff; padding: 6px 14px 8px;
  box-shadow: 5px 5px 0 var(--ink); }
.stat .k { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; }
.stat .v { font-size: 24px; font-weight: 800; }
.stat.red { background: var(--red); color: #fff; }
.stat.blue { background: var(--blue); color: #fff; }
main { display: grid; grid-template-columns: 1.5fr 1fr; gap: 26px; }
.block { border: 4px solid var(--ink); background: #fff; box-shadow: 8px 8px 0 var(--ink); }
.block h2 { margin: 0; padding: 8px 12px; border-bottom: 4px solid var(--ink);
  font-size: 14px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; }
.block h2.yellow { background: var(--yellow); }
.block h2.green { background: var(--green); color: #fff; }
.block h2.blue { background: var(--blue); color: #fff; }
canvas { display: block; width: 100%; }
.side .block { margin-bottom: 22px; }
footer { margin-top: 26px; display: flex; gap: 14px; align-items: center; }
button { font: inherit; font-weight: 800; text-transform: uppercase; font-size: 13px;
  letter-spacing: 0.07em; border: 3px solid var(--ink); background: #fff; padding: 8px 18px;
  box-shadow: 4px 4px 0 var(--ink); cursor: pointer; }
button:active { transform: translate(3px,3px); box-shadow: 1px 1px 0 var(--ink); }
button.on { background: var(--ink); color: var(--cream); }
.stripe { height: 14px; margin-top: 26px;
  background: repeating-linear-gradient(-45deg, var(--ink) 0 18px, var(--yellow) 18px 36px,
    var(--ink) 36px 54px, var(--red) 54px 72px); border: 3px solid var(--ink); }
</style>
</head>
<body>
<div id="poster">
  <header>
    <h1>celegans<span>&mdash;</span>sim</h1>
    <div class="tag">302 neurons · 95 muscles · one dish</div>
    <div class="tag b" style="margin-left:auto">TRACK B — NOT THE WORM™</div>
  </header>
  <div class="stats">
    <div class="stat"><div class="k">Time</div><div class="v">412s</div></div>
    <div class="stat red"><div class="k">Speed</div><div class="v">231</div></div>
    <div class="stat"><div class="k">Hz</div><div class="v">0.64</div></div>
    <div class="stat blue"><div class="k">Pop</div><div class="v">10</div></div>
    <div class="stat"><div class="k">Born</div><div class="v">142</div></div>
    <div class="stat"><div class="k">Died</div><div class="v">136</div></div>
  </div>
  <main>
    <div class="block">
      <h2 class="yellow">The Dish</h2>
      <canvas id="dish" width="650" height="520"></canvas>
    </div>
    <div class="side">
      <div class="block"><h2 class="green">Neurons</h2>
        <canvas id="neurons" width="430" height="96"></canvas></div>
      <div class="block"><h2 class="blue">Kymograph</h2>
        <canvas id="kymo" width="430" height="104"></canvas></div>
      <div class="block"><h2 class="yellow">Potential</h2>
        <canvas id="trace" width="430" height="96"></canvas></div>
    </div>
  </main>
  <footer>
    <button class="on">Pause</button><button>Reset</button>
    <button class="on">Agar</button><button>Viscous</button><button>Buffer</button>
    <button style="background:var(--red);color:#fff;margin-left:auto">Preserve!</button>
  </footer>
  <div class="stripe"></div>
</div>
<script>
const INK='#16130e', RED='#e0342b', YEL='#f5c518', BLU='#1857c3', GRN='#199e70', CRM='#f4efe4';
const D = document.getElementById('dish').getContext('2d');
function dish(t){
  const w=650,h=520,cx=w/2,cy=h/2,R=225;
  D.clearRect(0,0,w,h);
  // the plate: a huge flat yellow circle with thick ink ring + hard shadow
  D.fillStyle=INK; D.beginPath(); D.arc(cx+10,cy+10,R,0,7); D.fill();
  D.fillStyle=YEL; D.strokeStyle=INK; D.lineWidth=6;
  D.beginPath(); D.arc(cx,cy,R,0,7); D.fill(); D.stroke();
  // lawns: flat green discs, ink-ringed
  for (const [lx,ly,lr] of [[cx-80,cy-55,55],[cx+85,cy+60,42]]){
    D.fillStyle=GRN; D.beginPath(); D.arc(lx,ly,lr,0,7); D.fill();
    D.lineWidth=4; D.stroke(); }
  // eggs: white dots with ink ring
  for (const [ex,ey] of [[cx-30,cy+40],[cx-12,cy+52],[cx+8,cy+44]]){
    D.fillStyle='#fff'; D.beginPath(); D.arc(ex,ey,7,0,7); D.fill(); D.lineWidth=3; D.stroke(); }
  // worms: bold ink bodies, one red one blue
  const worm=(x0,y0,dir,col,ph)=>{
    D.lineCap='round';
    D.strokeStyle=INK; drawBody(x0,y0,dir,ph,15);
    D.strokeStyle=col; drawBody(x0,y0,dir,ph,9);
  };
  function drawBody(x0,y0,dir,ph,base){
    D.beginPath();
    for(let i=0;i<=48;i++){const u=i/48;
      const x=x0+dir*u*105, y=y0+Math.sin(u*4.4-t*2.6+ph)*15*(0.55+0.45*Math.sin(u*3.14));
      D.lineWidth=base*(Math.sin(u*3.14)*0.7+0.3);
      i?D.lineTo(x,y):D.moveTo(x,y);}
    D.stroke();
  }
  worm(cx-115,cy-35,1,RED,0);
  worm(cx+90,cy+90,-1,BLU,2.4);
}
const N=document.getElementById('neurons').getContext('2d');
function neurons(t){ N.clearRect(0,0,430,96); let s=5;
  for(let r=0;r<4;r++)for(let c=0;c<40;c++){ s=(s*16807)%2147483647;
    const v=(s/2147483647+Math.sin(t*3+c*0.5+r))*0.5;
    N.fillStyle=v>0.7?RED:v>0.4?BLU:'#d8d2c2';
    N.fillRect(8+c*10.5,8+r*22,7,7); } }
const K=document.getElementById('kymo').getContext('2d');
function kymo(t){ K.clearRect(0,0,430,104);
  for(let x=0;x<430;x+=8)for(let y=0;y<104;y+=8){
    const v=Math.sin(x*0.05-y*0.1-t*2.2);
    if(Math.abs(v)>0.25){ K.fillStyle=v>0?RED:BLU; K.fillRect(x,y,7,7);} } }
const T=document.getElementById('trace').getContext('2d');
function trace(t){ T.clearRect(0,0,430,96);
  const chans=[[RED,5,0],[BLU,5,2.1],[GRN,5,4.2]];
  for(const [c,wd,ph] of chans){ T.strokeStyle=c; T.lineWidth=wd; T.lineCap='round'; T.beginPath();
    for(let x=0;x<430;x+=4) T.lineTo(x,48-Math.sin(x*0.045+t*2.4+ph)*17);
    T.stroke(); } }
let t=0;(function loop(){t+=0.016;dish(t);neurons(t);kymo(t);trace(t);requestAnimationFrame(loop);})();
</script>
</body>
</html>
