<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design 4 — The Observatory</title>
<!-- Design language 4 of 5: THE OBSERVATORY. Deep-space glass: a luminous plate under
     frosted floating panels, bloom and depth. The current dark data-first soul, given
     atmosphere. Self-contained demo -- fake data, no imports, open via file://. -->
<style>
:root {
  --cyan: #7ae7ff; --violet: #c99aff; --mint: #7dffc4; --amber: #ffd27a;
  --txt: #e8f1fa; --mut: #8fa3b8;
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-weight: 300;
}
* { box-sizing: border-box; }
body { margin: 0; color: var(--txt); min-height: 100vh;
  background:
    radial-gradient(1100px 700px at 70% -10%, #17233f 0%, transparent 60%),
    radial-gradient(900px 600px at 10% 110%, #251a3a 0%, transparent 55%),
    #05070d; }
#deck { max-width: 1240px; margin: 0 auto; padding: 22px 26px 46px; }
header { display: flex; align-items: baseline; gap: 18px; }
h1 { font-size: 22px; font-weight: 200; letter-spacing: 0.28em; margin: 0;
  text-transform: uppercase; }
h1 b { font-weight: 600; color: var(--cyan); text-shadow: 0 0 18px rgba(122,231,255,0.5); }
.sub { color: var(--mut); font-size: 13px; }
.trackb { margin-left: auto; font-size: 12px; color: var(--amber); letter-spacing: 0.1em;
  border: 1px solid rgba(255,210,122,0.35); border-radius: 999px; padding: 4px 14px;
  background: rgba(255,210,122,0.06); backdrop-filter: blur(6px); }
.stats { display: flex; gap: 10px; margin: 18px 0; flex-wrap: wrap; }
.stat { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.09);
  border-radius: 14px; padding: 8px 16px; backdrop-filter: blur(10px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.35); }
.stat .k { font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--mut); }
.stat .v { font-size: 20px; font-weight: 500; }
.stat .v small { font-size: 11px; color: var(--mut); font-weight: 300; }
main { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; }
.glass { background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.09);
  border-radius: 20px; backdrop-filter: blur(12px);
  box-shadow: 0 18px 50px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.08);
  overflow: hidden; }
.glass h2 { margin: 0; padding: 10px 16px; font-size: 11px; font-weight: 500;
  letter-spacing: 0.2em; text-transform: uppercase; color: var(--mut);
  border-bottom: 1px solid rgba(255,255,255,0.07); }
.glass h2 i { float: right; font-style: normal; color: var(--cyan); }
canvas { display: block; width: 100%; }
.side .glass { margin-bottom: 16px; }
footer { margin-top: 20px; display: flex; gap: 10px; align-items: center; }
button { font: inherit; font-size: 12px; letter-spacing: 0.08em; color: var(--txt);
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 999px; padding: 8px 20px; backdrop-filter: blur(8px); cursor: pointer; }
button.on { background: rgba(122,231,255,0.14); border-color: rgba(122,231,255,0.5);
  color: var(--cyan); box-shadow: 0 0 22px rgba(122,231,255,0.25); }
button:hover { border-color: rgba(255,255,255,0.3); }
.spacer { flex: 1; }
</style>
</head>
<body>
<div id="deck">
  <header>
    <h1><b>celegans</b>&thinsp;sim</h1>
    <span class="sub">302 neurons · 95 muscles · one luminous plate</span>
    <span class="trackb">TRACK B · the arena · not the animal</span>
  </header>
  <div class="stats">
    <div class="stat"><div class="k">Time</div><div class="v">412.6<small>s</small></div></div>
    <div class="stat"><div class="k">Speed</div><div class="v">231<small>µm/s</small></div></div>
    <div class="stat"><div class="k">Undulation</div><div class="v">0.64<small>Hz</small></div></div>
    <div class="stat"><div class="k">Population</div><div class="v">10<small>/10</small></div></div>
    <div class="stat"><div class="k">Energy</div><div class="v">0.61</div></div>
    <div class="stat"><div class="k">Dynasties</div><div class="v" style="color:var(--violet)">F2:6 or:4</div></div>
  </div>
  <main>
    <div class="glass"><h2>The dish <i>26.0 mm</i></h2>
      <canvas id="dish" width="660" height="520"></canvas></div>
    <div class="side">
      <div class="glass"><h2>Nervous system <i>302</i></h2>
        <canvas id="neurons" width="440" height="100"></canvas></div>
      <div class="glass"><h2>Kymograph <i>20 s</i></h2>
        <canvas id="kymo" width="440" height="110"></canvas></div>
      <div class="glass"><h2>Membrane potential <i>DB01 · VB01 · AVBL</i></h2>
        <canvas id="trace" width="440" height="100"></canvas></div>
    </div>
  </main>
  <footer>
    <button class="on">Pause</button><button>Reset</button>
    <button class="on">Agar</button><button>Viscous</button><button>Buffer</button>
    <span class="spacer"></span>
    <button>Preserve</button><button class="on">Museum</button>
  </footer>
</div>
<script>
const CYAN='#7ae7ff', VIO='#c99aff', MINT='#7dffc4', AMB='#ffd27a', MUT='#8fa3b8';
const D=document.getElementById('dish').getContext('2d');
function dish(t){
  const w=660,h=520,cx=w/2,cy=h/2,R=232;
  D.clearRect(0,0,w,h);
  // luminous plate
  let g=D.createRadialGradient(cx,cy,0,cx,cy,R);
  g.addColorStop(0,'#0d1626'); g.addColorStop(0.8,'#090f1c'); g.addColorStop(1,'#070b15');
  D.fillStyle=g; D.beginPath(); D.arc(cx,cy,R,0,7); D.fill();
  D.strokeStyle='rgba(122,231,255,0.5)'; D.lineWidth=1.6;
  D.shadowColor=CYAN; D.shadowBlur=22; D.stroke(); D.shadowBlur=0;
  // lawns: soft mint bloom
  for (const [lx,ly,lr] of [[cx-85,cy-55,64],[cx+92,cy+58,48]]){
    const lg=D.createRadialGradient(lx,ly,0,lx,ly,lr);
    lg.addColorStop(0,'rgba(125,255,196,0.34)'); lg.addColorStop(1,'rgba(125,255,196,0)');
    D.fillStyle=lg; D.beginPath(); D.arc(lx,ly,lr,0,7); D.fill(); }
  // corpse bloom
  const cg=D.createRadialGradient(cx+20,cy+95,0,cx+20,cy+95,26);
  cg.addColorStop(0,'rgba(255,210,122,0.4)'); cg.addColorStop(1,'rgba(255,210,122,0)');
  D.fillStyle=cg; D.beginPath(); D.arc(cx+20,cy+95,26,0,7); D.fill();
  // trails
  D.strokeStyle='rgba(201,154,255,0.18)'; D.lineWidth=1.4; D.beginPath();
  for(let i=0;i<140;i++){const u=i/140;
    D.lineTo(cx-140+u*200+Math.sin(u*8+t*0.15)*18, cy+80-u*120);} D.stroke();
  // worms: glowing gradient bodies
  const worm=(x0,y0,dir,c1,c2,ph)=>{
    D.lineCap='round'; D.shadowBlur=14;
    for(let i=0;i<48;i++){const u=i/48,u2=(i+1)/48;
      const x=x0+dir*u*100, y=y0+Math.sin(u*4.4-t*2.6+ph)*16*(0.55+0.45*Math.sin(u*3.14));
      const x2=x0+dir*u2*100, y2=y0+Math.sin(u2*4.4-t*2.6+ph)*16*(0.55+0.45*Math.sin(u2*3.14));
      const mix=i/48;
      D.strokeStyle=mix<0.5?c1:c2; D.shadowColor=D.strokeStyle;
      D.lineWidth=7*(Math.sin(u*3.14)*0.72+0.3);
      D.beginPath(); D.moveTo(x,y); D.lineTo(x2,y2); D.stroke(); }
    D.shadowBlur=0;
  };
  worm(cx-110,cy-30,1,CYAN,VIO,0);
  worm(cx+95,cy+85,-1,VIO,MINT,2.2);
  // focus ring
  D.strokeStyle='rgba(232,241,250,0.35)'; D.setLineDash([5,6]); D.lineWidth=1.4;
  D.beginPath(); D.arc(cx-60,cy-30,46,0,7); D.stroke(); D.setLineDash([]);
}
const N=document.getElementById('neurons').getContext('2d');
function neurons(t){ N.clearRect(0,0,440,100); let s=9;
  for(let r=0;r<4;r++)for(let c=0;c<46;c++){ s=(s*16807)%2147483647;
    const v=(s/2147483647+Math.sin(t*3+c*0.4+r))*0.5;
    N.fillStyle=v>0.75?CYAN:v>0.42?'rgba(122,231,255,0.35)':'rgba(143,163,184,0.16)';
    N.beginPath(); N.arc(12+c*9.3,14+r*24,3,0,7); N.fill(); } }
const K=document.getElementById('kymo').getContext('2d');
function kymo(t){ K.clearRect(0,0,440,110);
  for(let x=0;x<440;x+=3)for(let y=0;y<110;y+=4){
    const v=Math.sin(x*0.05-y*0.09-t*2.2);
    if(Math.abs(v)>0.2){ K.fillStyle=v>0?`rgba(255,140,150,${v*0.7})`:`rgba(122,180,255,${-v*0.7})`;
      K.fillRect(x,y,2.4,3.2); } } }
const T=document.getElementById('trace').getContext('2d');
function trace(t){ T.clearRect(0,0,440,100);
  const chans=[[CYAN,0],[VIO,2.1],[MINT,4.2]];
  for(const [c,ph] of chans){ T.strokeStyle=c; T.lineWidth=1.6;
    T.shadowColor=c; T.shadowBlur=6; T.beginPath();
    for(let x=0;x<440;x++) T.lineTo(x,50-Math.sin(x*0.05+t*2.4+ph)*17-Math.sin(x*0.012+ph)*7);
    T.stroke(); } T.shadowBlur=0; }
let t=0;(function loop(){t+=0.016;dish(t);neurons(t);kymo(t);trace(t);requestAnimationFrame(loop);})();
</script>
</body>
</html>
